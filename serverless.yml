service: line-payment-bot
frameworkVersion: "4"
provider:
  name: aws
  runtime: nodejs20.x
  region: ap-northeast-1
  environment:
    LINE_CHANNEL_ACCESS_TOKEN: ${env:LINE_CHANNEL_ACCESS_TOKEN}
    LINE_CHANNEL_SECRET: ${env:LINE_CHANNEL_SECRET}
    LINE_BOT_USER_ID: ${env:LINE_BOT_USER_ID}
    DATABASE_URL: ${env:DATABASE_URL}
    APP_TIMEZONE: Asia/Tokyo
functions:
  webhook:
    handler: dist/src/lambda.webhook
    events:
      - httpApi:
          path: /webhook
          method: POST
  scheduled:
    handler: dist/src/lambda.scheduled
    timeout: 30
    events:
      - schedule:
          rate: cron(5 15 * * ? *)
          enabled: true
package:
  patterns:
    - dist/**
    - node_modules/**
