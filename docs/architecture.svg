<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">LINE支払いBOT インフラ構成図</title>
  <desc id="desc">LINE、Cloudflare Worker、D1、Cron Trigger、LINE Loginの接続関係を3列で示す構成図</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#27194a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#736a80"/>
    </marker>
    <style>
      .title{font:700 30px 'Meiryo','Yu Gothic',sans-serif;fill:#211b2b}
      .subtitle{font:400 15px 'Meiryo','Yu Gothic',sans-serif;fill:#756d80}
      .column{font:700 14px 'Meiryo','Yu Gothic',sans-serif;letter-spacing:.09em;fill:#665d72}
      .node-title{font:700 19px 'Meiryo','Yu Gothic',sans-serif;fill:#26202f}
      .node-copy{font:400 14px 'Meiryo','Yu Gothic',sans-serif;fill:#756d80}
      .small{font:600 12px 'Meiryo','Yu Gothic',sans-serif;fill:#665d72}
      .edge{fill:none;stroke:#736a80;stroke-width:2.4;marker-end:url(#arrow)}
      .edge-both{fill:none;stroke:#736a80;stroke-width:2.4;marker-start:url(#arrow);marker-end:url(#arrow)}
      .edge-soft{fill:none;stroke:#a098ad;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1500" height="920" fill="#fff"/>
  <text class="title" x="50" y="56">LINE支払いBOT ─ Infrastructure</text>
  <text class="subtitle" x="50" y="84">メッセージ受付、定期通知、ダッシュボードをCloudflare上で一元運用</text>

  <!-- Column backgrounds -->
  <rect x="40" y="120" width="360" height="750" rx="26" fill="#f7f6f9" stroke="#e5e1e9"/>
  <rect x="450" y="120" width="590" height="750" rx="26" fill="#fbf9ff" stroke="#d9cef3" stroke-width="2"/>
  <rect x="1090" y="120" width="370" height="750" rx="26" fill="#f8f9ff" stroke="#dce2f4"/>

  <text class="column" x="70" y="158">USER &amp; TRIGGERS</text>
  <g transform="translate(480 138)"><path d="M3 18h25c3 0 5-2 5-5 0-2-2-4-4-5C28 3 24 0 19 0 13 0 8 4 7 9c-4 0-7 2-7 5 0 2 1 4 3 4z" fill="#f48120"/></g>
  <text class="column" x="523" y="158" fill="#d96812">CLOUDFLARE WORKER</text>
  <text class="column" x="1120" y="158">MANAGED SERVICES</text>

  <!-- LINE Messaging -->
  <g filter="url(#shadow)">
    <rect x="75" y="205" width="290" height="130" rx="20" fill="#fff"/>
    <rect x="100" y="237" width="58" height="58" rx="16" fill="#06c755"/>
    <path d="M111 251h36v23c0 7-7 12-18 12l-8 7 3-8c-8-2-13-6-13-12z" fill="#fff"/>
    <text x="129" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#06c755">LINE</text>
    <text class="node-title" x="180" y="255">Messaging API</text>
    <text class="node-copy" x="180" y="280">グループメッセージ</text>
    <text class="node-copy" x="180" y="303">Webhook / Reply / Push</text>
  </g>

  <!-- Cron -->
  <g filter="url(#shadow)">
    <rect x="75" y="425" width="290" height="130" rx="20" fill="#fff"/>
    <circle cx="129" cy="476" r="29" fill="#ffe7d3"/>
    <circle cx="129" cy="476" r="15" fill="none" stroke="#d96812" stroke-width="3"/>
    <path d="M129 466v11l8 5" stroke="#d96812" stroke-width="3" stroke-linecap="round"/>
    <text class="node-title" x="180" y="470">Cron Trigger</text>
    <text class="node-copy" x="180" y="495">毎日 UTC 21:00</text>
    <text class="node-copy" x="180" y="518">日本時間 06:00</text>
  </g>

  <!-- Browser -->
  <g filter="url(#shadow)">
    <rect x="75" y="645" width="290" height="130" rx="20" fill="#fff"/>
    <rect x="101" y="680" width="57" height="44" rx="6" fill="none" stroke="#5c6ecf" stroke-width="3"/>
    <path d="M101 692h57M110 686h1M118 686h1" stroke="#5c6ecf" stroke-width="3" stroke-linecap="round"/>
    <text class="node-title" x="180" y="695">Webブラウザ</text>
    <text class="node-copy" x="180" y="720">支払い状況を確認</text>
    <text class="node-copy" x="180" y="743">ユーザーごとの表示</text>
  </g>

  <!-- Webhook + Bot -->
  <g filter="url(#shadow)">
    <rect x="505" y="195" width="480" height="150" rx="20" fill="#fff" stroke="#f1c89f"/>
    <circle cx="555" cy="245" r="27" fill="#ffe5ce"/>
    <path d="M541 245h28M555 231v28M545 235l-9 10 9 10M565 235l9 10-9 10" fill="none" stroke="#d96812" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="node-title" x="600" y="233">Webhook API / PaymentBot</text>
    <text class="node-copy" x="600" y="262">POST /webhook・HMAC署名検証</text>
    <text class="node-copy" x="600" y="287">支払い項目の登録・確認・完了</text>
    <rect x="600" y="305" width="126" height="24" rx="12" fill="#fff1e4"/>
    <text class="small" x="663" y="322" text-anchor="middle" fill="#bd5b10">TypeScript / Hono</text>
  </g>

  <!-- Scheduler -->
  <g filter="url(#shadow)">
    <rect x="505" y="415" width="480" height="150" rx="20" fill="#fff" stroke="#d6c4ff"/>
    <circle cx="555" cy="465" r="27" fill="#e8deff"/>
    <circle cx="555" cy="465" r="15" fill="none" stroke="#6d3ee8" stroke-width="3"/>
    <path d="M555 455v11l8 5" stroke="#6d3ee8" stroke-width="3" stroke-linecap="round"/>
    <text class="node-title" x="600" y="453">PaymentScheduler</text>
    <text class="node-copy" x="600" y="482">支払い依頼・支払当日</text>
    <text class="node-copy" x="600" y="507">期限超過通知を支払い者別に集約</text>
    <rect x="600" y="525" width="121" height="24" rx="12" fill="#f0eaff"/>
    <text class="small" x="660" y="542" text-anchor="middle" fill="#6540c4">LINE Push API</text>
  </g>

  <!-- Dashboard -->
  <g filter="url(#shadow)">
    <rect x="505" y="635" width="480" height="150" rx="20" fill="#fff" stroke="#cbd3f6"/>
    <circle cx="555" cy="685" r="27" fill="#e9edff"/>
    <rect x="540" y="672" width="30" height="25" fill="none" stroke="#5369ce" stroke-width="3"/>
    <path d="M547 690v-7M555 690v-13M563 690v-9" stroke="#5369ce" stroke-width="3"/>
    <text class="node-title" x="600" y="673">Web Dashboard</text>
    <text class="node-copy" x="600" y="702">月別推移・完了率・項目別内訳</text>
    <text class="node-copy" x="600" y="727">LINE Loginで本人の項目だけ表示</text>
    <rect x="600" y="745" width="104" height="24" rx="12" fill="#edf0ff"/>
    <text class="small" x="652" y="762" text-anchor="middle" fill="#4e62bb">HTTPS</text>
  </g>

  <!-- D1 -->
  <g filter="url(#shadow)">
    <rect x="1130" y="205" width="290" height="180" rx="22" fill="#fff"/>
    <ellipse cx="1185" cy="253" rx="28" ry="11" fill="#dfe7ff" stroke="#5572d8" stroke-width="3"/>
    <path d="M1157 253v43c0 7 13 12 28 12s28-5 28-12v-43M1157 275c0 7 13 12 28 12s28-5 28-12" fill="#eef2ff" stroke="#5572d8" stroke-width="3"/>
    <text class="node-title" x="1235" y="255">Cloudflare D1</text>
    <text class="node-copy" x="1235" y="280">SQLite Database</text>
    <text class="node-copy" x="1160" y="338">支払い・会話状態・通知履歴</text>
    <text class="node-copy" x="1160" y="361">ユーザー別ダッシュボード集計</text>
  </g>

  <!-- LINE Login -->
  <g filter="url(#shadow)">
    <rect x="1130" y="500" width="290" height="130" rx="20" fill="#fff"/>
    <rect x="1155" y="535" width="58" height="58" rx="16" fill="#06c755"/>
    <circle cx="1179" cy="558" r="10" fill="none" stroke="#fff" stroke-width="4"/>
    <path d="M1187 566l12 12M1196 575l-5 5" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text class="node-title" x="1235" y="550">LINE Login</text>
    <text class="node-copy" x="1235" y="577">OAuth 2.0</text>
    <text class="node-copy" x="1235" y="600">本人認証</text>
  </g>

  <!-- Secrets -->
  <g filter="url(#shadow)">
    <rect x="1130" y="690" width="290" height="120" rx="20" fill="#fff"/>
    <circle cx="1185" cy="739" r="27" fill="#eeeaf2"/>
    <circle cx="1177" cy="732" r="9" fill="none" stroke="#756d80" stroke-width="3"/>
    <path d="M1184 739l16 16M1195 750l6-6" stroke="#756d80" stroke-width="3" stroke-linecap="round"/>
    <text class="node-title" x="1235" y="730">Workers Secrets</text>
    <text class="node-copy" x="1235" y="757">LINE認証情報</text>
    <text class="node-copy" x="1235" y="780">セッション署名鍵</text>
  </g>

  <!-- Straight, separated connections -->
  <path class="edge-both" d="M365 270H505"/>
  <rect x="392" y="244" width="88" height="22" rx="11" fill="#fff"/>
  <text class="small" x="436" y="260" text-anchor="middle">Webhook / Reply</text>

  <path class="edge" d="M985 270H1130"/>
  <rect x="1020" y="244" width="76" height="22" rx="11" fill="#fff"/>
  <text class="small" x="1058" y="260" text-anchor="middle">Store</text>

  <path class="edge" d="M365 490H505"/>
  <rect x="405" y="464" width="62" height="22" rx="11" fill="#fff"/>
  <text class="small" x="436" y="480" text-anchor="middle">起動</text>

  <path class="edge" d="M985 470H1060V340H1130"/>
  <rect x="1010" y="397" width="99" height="22" rx="11" fill="#fff"/>
  <text class="small" x="1060" y="413" text-anchor="middle">対象抽出・記録</text>

  <path class="edge" d="M505 535H435V315H365"/>
  <rect x="397" y="383" width="76" height="22" rx="11" fill="#fff"/>
  <text class="small" x="435" y="399" text-anchor="middle">Push通知</text>

  <path class="edge" d="M365 710H505"/>
  <rect x="407" y="684" width="58" height="22" rx="11" fill="#fff"/>
  <text class="small" x="436" y="700" text-anchor="middle">HTTPS</text>

  <path class="edge" d="M985 680H1080V360H1130"/>
  <rect x="1034" y="493" width="92" height="22" rx="11" fill="#fff"/>
  <text class="small" x="1080" y="509" text-anchor="middle">集計データ</text>

  <path class="edge-both" d="M985 735H1060V565H1130"/>
  <rect x="1025" y="630" width="69" height="22" rx="11" fill="#fff"/>
  <text class="small" x="1060" y="646" text-anchor="middle">OAuth</text>

  <path class="edge-soft" d="M1130 750H1040"/>
  <rect x="1046" y="724" width="76" height="22" rx="11" fill="#fff"/>
  <text class="small" x="1084" y="740" text-anchor="middle">安全に注入</text>

  <rect x="50" y="842" width="410" height="38" rx="19" fill="#f1ecff"/>
  <circle cx="75" cy="861" r="6" fill="#6d3ee8"/>
  <text class="small" x="92" y="866">本番基盤：Cloudflare Workers + D1（無料枠）</text>
</svg>
